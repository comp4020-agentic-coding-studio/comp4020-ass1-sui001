<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMP4020 prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Speed of Thought</h1>
      <section id="reaction-test" aria-labelledby="reaction-heading">
        <h2 id="reaction-heading">Round 1: how fast are you, really?</h2>
        <p data-testid="reaction-readout" aria-live="polite">
          Hit start. A dot will appear somewhere on the field below —
          click it the instant you see it. We're timing you, and it gets
          meaner as it goes.
        </p>
        <button type="button" data-testid="start-button">Start</button>
        <div data-testid="play-field" id="play-field">
          <button
            type="button"
            data-testid="dot-target"
            id="dot-target"
            hidden
            aria-label="Click me"
          ></button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
